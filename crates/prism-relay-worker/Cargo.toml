[package]
name = "prism-relay-worker"
description = "The sync relay, hosted on Cloudflare Workers."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
prism-relay = { path = "../prism-relay", default-features = false }
prism-github = { path = "../prism-github" }
worker = "0.8"
serde_json = "1"
# p256 reaches for randomness it never uses to sign; on wasm that needs saying how.
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# A workspace of its own: it builds for wasm32 only.
[workspace]
