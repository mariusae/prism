# The sync relay: GitHub tells it of each push to a graph's repository; it
# tells the devices that keep that graph — iPhones by a silent push, Macs
# over a WebSocket they hold open — so each syncs at once.
name = "prism-relay"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"

[build]
# worker-build is held to the line that builds worker 0.8, which this crate is written to:
# the newest refuses it. To move on, take worker to 0.9 in Cargo.toml and drop the pin.
command = "cargo install -q worker-build@^0.8 && worker-build --release"

# One hub per repository: its iPhones' push tokens, and the Macs listening.
[[durable_objects.bindings]]
name = "HUBS"
class_name = "RepoHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RepoHub"]

[vars]
# The apps an iPhone may register for: their bundle identifiers, the
# topics APNs pushes to. Comma-separated.
APNS_TOPICS = "org.mutable.prism,org.mutable.weft"
# Who may dictate through the relay's ElevenLabs key: GitHub logins,
# comma-separated. None named, no one may.
SCRIBE_USERS = "mariusae"

# Secrets, set with `npx wrangler secret put <NAME>` (see README.md):
#   GITHUB_WEBHOOK_SECRET  the GitHub App's webhook secret
#   APNS_KEY               the .p8 key's contents, PEM and all
#   APNS_KEY_ID            the key's ID
#   APNS_TEAM_ID           the Apple Developer team's ID
#   ELEVENLABS_API_KEY     the ElevenLabs account's key, for dictation
# Without the three APNS secrets the relay still tells listening Macs;
# without ELEVENLABS_API_KEY it hands out no tokens, and the apps
# dictate with Apple's own recognition.
